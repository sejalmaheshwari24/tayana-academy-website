name: audit

# Runs the same checks Vercel runs at build time, but on pull requests — so a
# problem is visible before merge rather than at deploy. Once branch protection
# is enabled, make "course-language" a required status check.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  course-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Course-language audit
        run: python3 scripts/audit-course-language.py

  forms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lead endpoint checks
        working-directory: scripts
        run: node test-lead.js
